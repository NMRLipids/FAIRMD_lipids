[tox]
min_version = 4.0
# these are the default environments, i.e. the list of tests running when you
# execute `tox` in the command-line without anything else
envlist =
    lint
    build
    tests-min

[testenv]
passenv = *

lint_folders =
    "{toxinidir}/src/" \
    "{toxinidir}/tests/" \
    "{toxinidir}/docs/src/"

[testenv:tests-min]
description = Run minimal tests with pytest
package = editable
usedevelop = true
deps =
    pytest
    pytest-check
    pytest-mock
    pytest-cov
    responses
allowlist_externals = cp
commands_pre =
    cp -r {toxinidir}/src/fairmd/lipids/data/ToyData {toxinidir}/tests/
commands =
    pytest -m min --cov=fairmd.lipids --cov-append --cov-report= {posargs}

[testenv:profile-tests]
description = Profile minimal tests with cProfile (not a CI test environment)
package = editable
usedevelop = true
allowlist_externals = cp
deps =
    pytest
    pytest-check
    pytest-mock
    responses
commands_pre =
    cp -r {toxinidir}/src/fairmd/lipids/data/ToyData {toxinidir}/tests/
commands =
    python {toxinidir}/developer/profile_tests.py -m min --durations=0 --durations-min=0 {posargs}

[testenv:tests-rdkit]
description = Run tests with RDKit
package = editable
usedevelop = true
allowlist_externals = cp
deps =
    pytest
    pytest-check
    pytest-mock
    responses
    rdkit
commands_pre =
    cp -r {toxinidir}/src/fairmd/lipids/data/ToyData {toxinidir}/tests/
commands =
    pytest -m rdkit {posargs}

[testenv:tests-package]
description = Run all package tests with pytest (requires GROMACS), excluding develop tests
package = editable
usedevelop = true
allowlist_externals = gmx, cp
commands_pre =
    cp -r {toxinidir}/src/fairmd/lipids/data/ToyData {toxinidir}/tests/
deps =
    pytest
    pytest-check
    pytest-mock
    responses
    rdkit
    joblib
commands =
    gmx --version  # gromacs must be installed on the system
    pytest -m "not develop" {posargs}
    

[testenv:tests-develop]
description = Run out-of-package develop tests (developer/ scripts, not distributed)
package = editable
usedevelop = true
allowlist_externals = cp
commands_pre =
    cp -r {toxinidir}/src/fairmd/lipids/data/ToyData {toxinidir}/tests/
deps =
    pytest
    pytest-check
    pytest-mock
    responses
    rdkit
    tables
    unidecode
commands =
    pytest -m develop {posargs}


[testenv:lint]
description = Run linters and type checks
package = skip
deps =
    ruff
    sphinx-lint
commands =
    ruff format --diff {[testenv]lint_folders}
    ruff check {[testenv]lint_folders}
    python {toxinidir}/developer/format_json_schemas.py --check
    sphinx-lint \
        --enable all \
        --disable line-too-long \
        {[testenv]lint_folders} "{toxinidir}/README.md"

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps =
    ruff
commands =
    ruff format {[testenv]lint_folders}
    ruff check --fix-only {[testenv]lint_folders} "{toxinidir}/README.md" {posargs}
    python {toxinidir}/developer/format_json_schemas.py

[testenv:build]
description = builds the package and checks integrity
usedevelop = true
deps =
    build
    check-manifest
    twine
allowlist_externals = bash
commands_pre =
    bash -c "rm -f dist/*.whl"
    bash -c "rm -f dist/*.tar.gz"
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest {toxinidir}

[testenv:docs]
description = builds the documentation with sphinx
deps =
    -r docs/requirements.txt
set_env = 
    FMDL_DATA_PATH = {toxinidir}/src/fairmd/lipids/data/ToyData
commands_pre =
    python docs/src/run_apidoc.py
commands =
    sphinx-build \
        {posargs:-E} \
        --builder html \
        --doctree-dir docs/build/doctree \
        # --fail-on-warning \
        docs/src docs/build/html
